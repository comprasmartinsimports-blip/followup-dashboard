<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Marketplaces</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* ── Tokens de tema (escuro = padrão; claro sob [data-theme="light"]) ──
         O app usa var(--...) no lugar das cores fixas, então trocar o tema troca tudo. */
      /* Paleta: primária = PANTONE 7544 C (#768692, azul-acinzentado) · claro = nude */
      :root{
        --bg:#0A0F18; --bg-2:#121A24; --surface:#182230; --surface-3:#223048;
        --text-strong:#FFFFFF; --text-2:#A9B4C5; --text-3:#67759B; --text-4:#4A5878;
        --border:rgba(255,255,255,.12); --border-soft:rgba(255,255,255,.08);
        --app-bg-image:radial-gradient(1100px 500px at 75% -10%, rgba(118,134,146,.12), transparent 60%),
                       radial-gradient(800px 420px at -10% 110%, rgba(118,134,146,.06), transparent 60%);
        color-scheme:dark;
      }
      :root[data-theme="light"]{
        /* Nude claro: fundos em bege quente, superfícies em creme */
        --bg:#efe7dd; --bg-2:#f6f0e8; --surface:#fbf7f1; --surface-3:#ece2d5;
        --text-strong:#2e2a25; --text-2:#5c554c; --text-3:#8a8177; --text-4:#ab9f90;
        --border:#e2d7c8; --border-soft:#ede5da;
        --app-bg-image:none;
        color-scheme:light;
      }
      body{ background:var(--bg); background-image:var(--app-bg-image);
        -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        letter-spacing:-0.006em; text-rendering:optimizeLegibility; }
      /* Tipografia mais delicada: números tabulares finos e fontes suavizadas em todo o app */
      *{ font-variant-numeric:lining-nums tabular-nums; }
      /* Remove as setinhas (spinner) dos campos numéricos em todo o sistema */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
      input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }
      /* Exportar PDF (window.print): fundo branco e cores preservadas para leitura/impressão */
      @media print {
        body{ background:#fff !important; background-image:none !important; }
        *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
